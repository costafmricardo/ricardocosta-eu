<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="28%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#FF6B2B" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FF6B2B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="100%" stop-color="#FF6B2B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ash background -->
  <rect width="1200" height="630" fill="#171411"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Forge frame accent (left edge) -->
  <rect x="0" y="0" width="8" height="630" fill="#FF6B2B"/>

  <!-- Eyebrow -->
  <text x="80" y="142" font-family="Space Mono" font-weight="700" font-size="22"
        letter-spacing="7" fill="#FF6B2B">GUIA GRATUITO</text>

  <!-- Title — Instrument Serif Italic -->
  <text x="76" y="262" font-family="Instrument Serif" font-style="italic" font-size="104"
        fill="#EDE6DD">Pensar antes</text>
  <text x="76" y="366" font-family="Instrument Serif" font-style="italic" font-size="104"
        fill="#EDE6DD">de comprar IA</text>

  <!-- Thesis -->
  <text x="80" y="446" font-family="Instrument Serif" font-style="italic" font-size="40"
        fill="#BDB3A6">A alavanca não é a ferramenta.</text>
  <text x="80" y="496" font-family="Instrument Serif" font-style="italic" font-size="40"
        fill="#EDE6DD">É o pensar antes dela.</text>

  <!-- Footer rule -->
  <rect x="80" y="556" width="320" height="2" fill="url(#rule)"/>

  <!-- Footer meta -->
  <text x="80" y="592" font-family="Space Mono" font-weight="700" font-size="21"
        letter-spacing="1" fill="#EDE6DD">ricardocosta.eu/guia</text>
  <text x="1120" y="592" text-anchor="end" font-family="Space Mono" font-weight="400" font-size="19"
        letter-spacing="1" fill="#948779">@ricardocostaeu</text>
</svg>
